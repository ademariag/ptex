name: Private downloads ARM64 build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-downloads-arm-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'ademariag/ptex'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test and build both private download providers
        run: |
          cargo test --locked --release -p ptex
          cargo build --locked --release --bin ptex

      - name: Package ARM64 binary and source metadata
        run: |
          mkdir -p dist
          install -m 755 target/release/ptex dist/ptex-linux-aarch64
          (cd dist && sha256sum ptex-linux-aarch64 > ptex-linux-aarch64.sha256)
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg rustc "$(rustc --version)" \
            '{repository: $repository, commit: $commit, run_url: $run_url,
              target: "aarch64-unknown-linux-gnu", rustc: $rustc,
              providers: ["gcs", "github"], cargo_locked: true}' > dist/build-info.json

      - name: Upload ARM64 ptex binary, checksum, and build metadata
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ptex-private-linux-aarch64-gnu
          path: |
            dist/ptex-linux-aarch64
            dist/ptex-linux-aarch64.sha256
            dist/build-info.json
          if-no-files-found: error
          retention-days: 90

      - name: Link the download
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: printf '[Download ARM64 ptex](%s) (Linux aarch64/glibc; expires after 90 days).\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
